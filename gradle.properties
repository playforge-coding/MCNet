# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=1.0.0
maven_group=dev.mcnet
archives_base_name=mcnet

# Dependencies
fabric_api_version=0.157.0+26.2

# Kotlin. kotlin_version MUST match the Kotlin bundled by fabric-language-kotlin
# below, otherwise the metadata the compiler emits will not match the stdlib
# present at runtime.
fabric_kotlin_version=1.13.13+kotlin.2.4.10
kotlin_version=2.4.10

# iroh: peer-to-peer QUIC with hole punching, via its official Kotlin/UniFFI
# bindings. The plain `iroh` artifact bundles the native libiroh_ffi for
# win32-x86-64, linux-x86-64, linux-aarch64 and darwin-aarch64.
iroh_version=1.1.0
# iroh's bindings call into the native library through JNA. Minecraft already
# ships JNA (via com.github.oshi:oshi-core), so pin the same version it does:
# the jar is bundled as a fallback, and matching versions mean it cannot skew
# against the copy already on the game's classpath.
jna_version=5.17.0
