name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The voice addon's native video library (webcam capture plus the AV1
  # codecs), one build per platform the jar ships for. Rust cross-compiles
  # fine, but libaom and dav1d are built from source with cmake and meson, so
  # each platform builds on its own runner.
  video-natives:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            prefix: darwin-aarch64
            library: libmcnet_video.dylib
          - os: ubuntu-24.04
            prefix: linux-x86-64
            library: libmcnet_video.so
          - os: ubuntu-24.04-arm
            prefix: linux-aarch64
            library: libmcnet_video.so
          - os: windows-2025
            prefix: win32-x86-64
            library: mcnet_video.dll
    runs-on: ${{ matrix.os }}
    steps:
      # Submodules are fetched only when the library has to be built, since
      # aom alone is a large checkout.
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        id: rust

      # The tree hash of video/ covers the crate's sources, Cargo.lock and the
      # commits the aom and dav1d submodules are pinned to. Together with the
      # rustc version it identifies the library exactly. Bump the leading v1
      # if the build steps below change in a way that affects the output.
      - name: Compute the native cache key
        id: key
        shell: bash
        run: echo "tree=$(git rev-parse HEAD:video)" >> "$GITHUB_OUTPUT"

      # release.yml uses the same key, so a release of a commit that already
      # built on main reuses its libraries. Caches saved by pull requests are
      # visible only to that pull request, so a fork cannot plant one here.
      - uses: actions/cache@v6
        id: cache
        with:
          path: video/target/release/${{ matrix.library }}
          key: video-native-v1-${{ matrix.prefix }}-${{ matrix.os }}-${{ steps.rust.outputs.cachekey }}-${{ steps.key.outputs.tree }}

      - name: Fetch submodules
        if: steps.cache.outputs.cache-hit != 'true'
        run: git submodule update --init --depth 1

      - uses: actions/setup-python@v6
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.13"

      - name: Install meson and ninja
        if: steps.cache.outputs.cache-hit != 'true'
        run: pip install meson ninja

      - name: Install nasm
        if: runner.os == 'Linux' && steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y nasm

      - uses: ilammy/setup-nasm@v1
        if: runner.os == 'Windows' && steps.cache.outputs.cache-hit != 'true'

      # meson needs cl.exe on the PATH, which only a developer prompt provides.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows' && steps.cache.outputs.cache-hit != 'true'

      # `cargo test` alone builds only the test binaries, not the shared
      # library the next step uploads, so build that explicitly. A cached
      # library already passed these tests in the run that saved it.
      - name: Build and test
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cargo build --release --manifest-path video/Cargo.toml
          cargo test --release --manifest-path video/Cargo.toml

      - uses: actions/upload-artifact@v7
        with:
          name: video-native-${{ matrix.prefix }}
          path: video/target/release/${{ matrix.library }}
          if-no-files-found: error

  # iroh's native library with the Mainline DHT patch applied. dht/build.sh
  # clones upstream iroh-ffi, patches it and builds it, so there is no fork to
  # keep in sync. Same four platforms as the video library, each on its own
  # runner, since the library links platform code.
  iroh-natives:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            prefix: darwin-aarch64
            library: libiroh_ffi.dylib
          - os: ubuntu-24.04
            prefix: linux-x86-64
            library: libiroh_ffi.so
          - os: ubuntu-24.04-arm
            prefix: linux-aarch64
            library: libiroh_ffi.so
          - os: windows-2025
            prefix: win32-x86-64
            library: iroh_ffi.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        id: rust

      # The iroh version picks the upstream tag and the tree hash of dht/
      # covers the patch. With the rustc version they identify the library
      # and bindings exactly. Bump the leading v1 if dht/build.sh changes in
      # a way its tree hash would not show.
      - name: Compute the native cache key
        id: key
        shell: bash
        run: |
          echo "iroh=$(grep '^iroh_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD:dht)" >> "$GITHUB_OUTPUT"

      # Same key as release.yml, so a release of a commit that already
      # built on main reuses its library.
      - uses: actions/cache@v6
        id: cache
        with:
          path: iroh-out
          key: iroh-native-v1-${{ matrix.prefix }}-${{ matrix.os }}-${{ steps.rust.outputs.cachekey }}-${{ steps.key.outputs.iroh }}-${{ steps.key.outputs.tree }}

      - name: Patch and build iroh-ffi
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: dht/build.sh iroh-out

      - uses: actions/upload-artifact@v7
        with:
          name: iroh-native-${{ matrix.prefix }}
          path: iroh-out/natives/${{ matrix.prefix }}/${{ matrix.library }}
          if-no-files-found: error

      # The bindings come out the same on every platform, so one copy is
      # enough.
      - uses: actions/upload-artifact@v7
        if: matrix.prefix == 'linux-x86-64'
        with:
          name: iroh-bindings
          path: iroh-out/kotlin
          if-no-files-found: error

  build:
    needs: [video-natives, iroh-natives]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # gradle-wrapper.jar is an executable binary committed to the repo, which
      # makes it a supply-chain target: a modified wrapper runs arbitrary code
      # on every build. This checks it against the checksums Gradle publishes
      # for official releases, so a tampered jar fails the build rather than
      # silently executing.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/download-artifact@v7
        with:
          pattern: video-native-*
          path: video-natives

      - uses: actions/download-artifact@v7
        with:
          pattern: iroh-native-*
          path: iroh/natives

      - uses: actions/download-artifact@v7
        with:
          name: iroh-bindings
          path: iroh/kotlin

      # Each artifact lands in a folder named after itself; JNA wants the
      # folders named after the platform.
      - name: Arrange natives
        run: |
          set -euo pipefail
          for dir in video-natives/video-native-*; do
            mv "$dir" "video-natives/${dir#video-natives/video-native-}"
          done
          for dir in iroh/natives/iroh-native-*; do
            mv "$dir" "iroh/natives/${dir#iroh/natives/iroh-native-}"
          done
          find video-natives iroh -type f

      # The tests bind real iroh endpoints on loopback, so they exercise the
      # native library as well as the tunnel logic.
      - name: Build and test
        run: ./gradlew build -Pmcnet.videoNatives=video-natives -Pmcnet.iroh=iroh

      - uses: actions/upload-artifact@v7
        with:
          name: mcnet
          path: |
            build/libs/*.jar
            voice/build/libs/*.jar
