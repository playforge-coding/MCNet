name: release

on:
  release:
    types: [published]
  # Lets you produce a build without cutting a release; the jar lands as a
  # workflow artifact rather than being attached to anything.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp (defaults to gradle.properties)"
        required: false

permissions:
  # Required to attach the built jars to the release.
  contents: write

jobs:
  # Same matrix as build.yml: the voice jar bundles a native video library
  # per platform, each built on that platform.
  video-natives:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            prefix: darwin-aarch64
            library: libmcnet_video.dylib
          - os: ubuntu-24.04
            prefix: linux-x86-64
            library: libmcnet_video.so
          - os: ubuntu-24.04-arm
            prefix: linux-aarch64
            library: libmcnet_video.so
          - os: windows-2025
            prefix: win32-x86-64
            library: mcnet_video.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install meson and ninja
        run: pip install meson ninja

      - name: Install nasm
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm

      - uses: ilammy/setup-nasm@v1
        if: runner.os == 'Windows'

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      # `cargo test` alone builds only the test binaries, not the shared
      # library the next step uploads, so build that explicitly.
      - name: Build and test
        run: |
          cargo build --release --manifest-path video/Cargo.toml
          cargo test --release --manifest-path video/Cargo.toml

      - uses: actions/upload-artifact@v7
        with:
          name: video-native-${{ matrix.prefix }}
          path: video/target/release/${{ matrix.library }}
          if-no-files-found: error

  release:
    needs: video-natives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The same supply-chain check the build workflow runs. It matters more
      # here: this job produces the artifact people actually download.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/download-artifact@v7
        with:
          pattern: video-native-*
          path: video-natives

      - name: Arrange video natives
        run: |
          set -euo pipefail
          for dir in video-natives/video-native-*; do
            mv "$dir" "video-natives/${dir#video-natives/video-native-}"
          done
          find video-natives -type f

      # Tag and inputs go through the environment rather than being
      # interpolated straight into the shell, so a tag containing shell
      # metacharacters cannot execute.
      - name: Resolve version
        id: v
        env:
          TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${TAG:-}" ]; then
            VERSION="${TAG#v}"          # v1.2.3 -> 1.2.3
          elif [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building MCNet $VERSION"

      # `clean` so a stale jar from a previous version can never be published.
      # `build` runs the tests, which bind real iroh endpoints on loopback.
      - name: Build
        run: ./gradlew clean build -Pmod_version=${{ steps.v.outputs.version }} -Pmcnet.videoNatives=video-natives

      # A release jar that built successfully can still be unusable. Jar-in-Jar
      # is what makes MCNet a single-file install; if it silently did not
      # happen, the mod loads and then dies with NoClassDefFoundError the first
      # time someone hosts. Cheaper to catch here than in a bug report.
      - name: Verify the jars are complete
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          JAR="build/libs/mcnet-${VERSION}.jar"
          test -f "$JAR" || { echo "::error::$JAR was not produced"; exit 1; }

          unzip -l "$JAR" | grep -q 'META-INF/jars/iroh-' \
            || { echo "::error::iroh bindings are missing from the jar"; exit 1; }
          unzip -l "$JAR" | grep -q 'META-INF/jars/jna-' \
            || { echo "::error::JNA is missing from the jar"; exit 1; }
          unzip -p "$JAR" fabric.mod.json | grep -q "\"version\":\"${VERSION}\"" \
            || { echo "::error::fabric.mod.json was not stamped with ${VERSION}"; exit 1; }

          echo "$JAR looks complete ($(du -h "$JAR" | cut -f1))"

          # The voice addon nests Opus the same way, and must not nest iroh
          # again: the core provides it, and a second copy would double the
          # download for nothing.
          VOICE="voice/build/libs/mcnet-voice-${VERSION}.jar"
          test -f "$VOICE" || { echo "::error::$VOICE was not produced"; exit 1; }

          unzip -l "$VOICE" | grep -q 'META-INF/jars/opus4j-' \
            || { echo "::error::opus4j is missing from the voice jar"; exit 1; }
          if unzip -l "$VOICE" | grep -q 'META-INF/jars/iroh-'; then
            echo "::error::the voice jar must not bundle iroh; the core already does"; exit 1
          fi
          unzip -p "$VOICE" fabric.mod.json | grep -q "\"version\":\"${VERSION}\"" \
            || { echo "::error::the voice fabric.mod.json was not stamped with ${VERSION}"; exit 1; }

          # Cameras need the native video library for every platform. A
          # missing one would not fail the build; it would make video
          # silently unavailable on that platform.
          for native in darwin-aarch64/libmcnet_video.dylib linux-x86-64/libmcnet_video.so \
                        linux-aarch64/libmcnet_video.so win32-x86-64/mcnet_video.dll; do
            unzip -l "$VOICE" | grep -q "$native" \
              || { echo "::error::$native is missing from the voice jar"; exit 1; }
          done

          echo "$VOICE looks complete ($(du -h "$VOICE" | cut -f1))"

      - name: Attach jars to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.v.outputs.version }}
        # The GitHub CLI ships on the runner, so this needs no third-party
        # action with write access to the repository.
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            "build/libs/mcnet-${VERSION}.jar" \
            "build/libs/mcnet-${VERSION}-sources.jar" \
            "voice/build/libs/mcnet-voice-${VERSION}.jar" \
            "voice/build/libs/mcnet-voice-${VERSION}-sources.jar" \
            --clobber

      - uses: actions/upload-artifact@v7
        with:
          name: mcnet-${{ steps.v.outputs.version }}
          path: |
            build/libs/*.jar
            voice/build/libs/*.jar
