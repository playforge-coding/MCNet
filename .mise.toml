# MCNet targets Minecraft 26.3, which requires JDK 25.
# The iroh-ffi Kotlin build under dht/ needs JDK 21 instead. See dht/README.md.
#
# cmake, meson and ninja build libaom and dav1d from the submodules under
# video/vendor/ for the voice addon's cameras. nasm is also needed on x86_64,
# but mise has no package for it, so install it with the system package
# manager.
[tools]
cmake = "4.4.5"
java = "temurin-25"
meson = "1.12.1"
ninja = "1.13.2"
